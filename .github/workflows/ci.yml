name: CI - PULSE AI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: HR-pulse-ai-platform

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: mariambenali/HR-pulse-ai-platform_Frontend
          path: HR-pulse-ai-platform_Frontend 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: HR-pulse-ai-platform 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: HR-pulse-ai-platform 
        run: |
          pip install flake8
          flake8 app --max-line-length=120 --ignore=E501,W291,W293,E302,E303,E265,E203,E231,E225,E251,E252,E261,E262,W391,W292,E226

      - name: Run tests
        working-directory: HR-pulse-ai-platform
        run: pytest

  docker-compose:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Create .env file
        working-directory: HR-pulse-ai-platform
        run: |
          cp .env.example .env
          # OU génère depuis les secrets :
          # echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          # echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          # echo "ALGORITHM=${{ secrets.ALGORITHM}}" >> .env

      - name: Build and run containers
        working-directory: HR-pulse-ai-platform
        run: docker compose -f docker-compose.yml up --build -d

      - name: Tear down containers 
        if: always()
        working-directory: HR-pulse-ai-platform 
        run: docker compose -f docker-compose.yml down